name: Publish release

on: workflow_call

# Bundles the examples (cpp/, python/) into a zip and publishes
# it as a GitHub Release. Called by CI only on a version tag and only after
# the tests job passes.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Bundle examples
        run: |
          mkdir -p release_assets
          tag="${{ github.ref_name }}"
          zip -r "release_assets/qant-native-computing-toolkit-examples-${tag}.zip" cpp python
          ls -l release_assets
      - name: Create GitHub Release and attach bundle
        uses: softprops/action-gh-release@v2
        with:
          # published as a pre-release: consumable for validation, flagged unstable,
          # never "Latest". Promote with `gh release edit vX.Y.Z --prerelease=false --latest`.
          prerelease: true
          generate_release_notes: true
          files: release_assets/*.zip
          fail_on_unmatched_files: true
